<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3DEVO OFFICE FIGHTER</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#e8b923; --crimson:#b8362e; --bone:#efe6d3;
    --steel:#4a4f58; --steel-lt:#666c78; --steel-dk:#2c2f36;
    --hp-green:#8fd14f; --hp-yellow:#e8c547; --hp-red:#c0392b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{ display:none !important; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:#050507; color:var(--bone);
    overflow:hidden; overscroll-behavior:none;
    font-family:'VT323',monospace;
    -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #app{ position:fixed; inset:0; height:100dvh; width:100vw; display:flex; flex-direction:column; }

  #scanlines{ position:fixed; inset:0; z-index:900; pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.20) 0 1px, rgba(0,0,0,0) 2px 3px);
    mix-blend-mode:multiply; opacity:.5; }
  #vignette{ position:fixed; inset:0; z-index:899; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.5) 100%); }

  #screen-start{ position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(ellipse at 50% 25%, #2a2140 0%, #0c0a14 58%, #050507 100%); }
  #screen-start .logo{ font-family:'Press Start 2P',monospace; font-size:clamp(22px,7.4vw,38px);
    color:var(--gold); line-height:1.45; letter-spacing:1px;
    text-shadow:3px 0 0 var(--crimson), -3px 0 0 #2b8fd1, 0 0 22px rgba(232,185,35,.45); }
  #screen-start .sub{ margin-top:12px; font-size:15px; color:#8f8a9c; letter-spacing:3px; }
  #screen-start .prompt{ margin-top:54px; font-family:'Press Start 2P',monospace;
    font-size:clamp(13px,4.2vw,18px); animation:blink 1.1s steps(1) infinite; }
  #screen-start .coin{ margin-top:14px; font-size:13px; color:var(--steel-lt); letter-spacing:2px; }
  @keyframes blink{ 50%{opacity:0;} }

  #screen-game{ position:fixed; inset:0; display:flex; flex-direction:column; height:100dvh; }
  #viewport-top{ flex:0 0 50%; position:relative; overflow:hidden; background:#000;
    border-bottom:3px solid #2a2836; }
  #viewport-bottom{ flex:0 0 50%; position:relative; display:flex; align-items:center;
    justify-content:space-between; padding:0 2.5vw env(safe-area-inset-bottom);
    background:linear-gradient(to bottom,#1b1d22,#0e0f12); }

  #view{ position:absolute; inset:0; width:100%; height:100%; display:block;
    image-rendering:pixelated; image-rendering:crisp-edges; }

  #hud{ position:absolute; top:0; left:0; right:0; z-index:20; display:grid;
    grid-template-columns:1fr 1fr; gap:14px; padding:7px 9px 0; }
  .hp-block{ min-width:0; }
  .hp-block.foe{ text-align:right; }
  .hp-name{ font-family:'Press Start 2P',monospace; font-size:9px; margin-bottom:3px;
    text-shadow:1px 1px 0 #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hp-outer{ height:13px; width:100%; background:#1a1a1a; border:2px solid #000;
    position:relative; overflow:hidden; box-shadow:0 0 0 1px #55503f inset; }
  .hp-fill{ position:absolute; top:0; left:0; height:100%; width:100%; background:var(--hp-green);
    transition:width .22s ease-out, background .22s; }
  .hp-block.foe .hp-fill{ left:auto; right:0; }
  .round-mark{ position:absolute; top:7px; left:50%; transform:translateX(-50%); z-index:21;
    font-family:'Press Start 2P',monospace; font-size:11px; color:var(--gold);
    text-shadow:2px 2px 0 #000; }

  #select-view{ position:absolute; inset:0; z-index:30; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:6px 10px;
    background:radial-gradient(ellipse at 50% 0%, #2a2140 0%, #0c0a14 62%, #050507 100%); }
  #select-view .title{ font-family:'Press Start 2P',monospace; font-size:11px; color:var(--gold);
    letter-spacing:2px; margin-bottom:8px; text-shadow:2px 2px 0 #000; }
  .vs-row{ display:flex; align-items:center; justify-content:center; gap:2.4vw; width:100%; }
  .side{ display:flex; flex-direction:column; align-items:center; }
  .side-label{ margin-top:6px; font-family:'Press Start 2P',monospace; font-size:9px;
    text-shadow:2px 2px 0 #000; max-width:30vw; text-align:center; line-height:1.35; }
  .side-label.unknown{ color:#5f5b6e; }
  .vs-text{ font-family:'Press Start 2P',monospace; font-size:15px; color:var(--crimson);
    text-shadow:2px 2px 0 #000; margin-bottom:14px; }
  .portrait-frame{ width:26vw; max-width:112px; aspect-ratio:1/1.08; border:3px solid var(--gold);
    background:#12101a; box-shadow:0 0 0 3px #000, 0 0 16px rgba(232,185,35,.32);
    display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .portrait-frame.locked{ border-color:var(--steel); box-shadow:0 0 0 3px #000; }
  .portrait-frame.beaten{ border-color:#8fd14f; box-shadow:0 0 0 3px #000, 0 0 14px rgba(143,209,79,.35); }
  .portrait-frame canvas{ image-rendering:pixelated; display:block; }
  .portrait-frame .qmark{ font-family:'Press Start 2P',monospace; font-size:34px; color:#54525e; }
  #select-view .char-name{ margin-top:8px; font-family:'Press Start 2P',monospace; font-size:13px;
    text-shadow:2px 2px 0 #000; }
  .roster-strip{ display:flex; gap:1.3vw; margin-top:11px; justify-content:center; }
  .roster-thumb{ width:8.6vw; max-width:37px; aspect-ratio:1/1; border:2px solid var(--steel);
    background:#0a0910; overflow:hidden; opacity:.55; position:relative;
    display:flex; align-items:center; justify-content:center; }
  .roster-thumb canvas{ image-rendering:pixelated; display:block; }
  .roster-thumb .q{ font-family:'Press Start 2P',monospace; font-size:13px; color:#54525e; }
  .roster-thumb.active{ border-color:var(--gold); opacity:1;
    box-shadow:0 0 0 2px #000, 0 0 9px rgba(232,185,35,.55); }
  .roster-thumb.active::after{ content:'▲'; position:absolute; top:-12px; left:50%;
    transform:translateX(-50%); font-size:9px; color:var(--gold); }
  .roster-thumb.done{ border-color:#8fd14f; }
  .roster-thumb.done .tick{ position:absolute; right:0; bottom:-1px; font-size:11px;
    color:#8fd14f; text-shadow:1px 1px 0 #000; line-height:1; }
  .hint-row{ display:flex; gap:5vw; margin-top:9px; font-size:12px; color:#6f6a80; letter-spacing:1px; }
  .credits-hint{ margin-top:5px; font-family:'Press Start 2P',monospace; font-size:8px;
    color:#8fd14f; text-shadow:1px 1px 0 #000; animation:blink 1.6s steps(1) infinite; }
  #toast{ position:absolute; bottom:7%; left:50%; transform:translateX(-50%);
    font-family:'Press Start 2P',monospace; font-size:9px; background:rgba(0,0,0,.8);
    border:2px solid var(--gold); padding:7px 11px; opacity:0; pointer-events:none; white-space:nowrap; }
  #toast.show{ animation:toastPop 1.7s ease-out forwards; }
  @keyframes toastPop{ 0%{opacity:0;transform:translate(-50%,10px);} 15%{opacity:1;transform:translate(-50%,0);}
    80%{opacity:1;} 100%{opacity:0;} }

  #victory-view{ position:absolute; inset:0; z-index:40; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:0 6vw;
    background:rgba(5,4,8,.86); }
  #victory-view .ko{ font-family:'Press Start 2P',monospace; font-size:clamp(24px,8.5vw,38px);
    color:var(--crimson); letter-spacing:2px; text-shadow:3px 3px 0 #000, 0 0 22px rgba(184,54,46,.55); }
  #victory-view .joke{ margin-top:14px; font-size:17px; line-height:1.4; max-width:32ch; }
  #victory-view .continue{ margin-top:22px; font-family:'Press Start 2P',monospace; font-size:11px;
    color:var(--gold); animation:blink 1.1s steps(1) infinite; }

  #credits-view{ position:fixed; inset:0; z-index:200; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:0 8vw;
    background:radial-gradient(ellipse at 50% 25%, #2a2140 0%, #0c0a14 58%, #050507 100%); }
  #credits-view .ctitle{ font-family:'Press Start 2P',monospace; font-size:clamp(16px,5.4vw,26px);
    color:var(--gold); line-height:1.5; letter-spacing:1px;
    text-shadow:3px 0 0 var(--crimson), -3px 0 0 #2b8fd1, 0 0 20px rgba(232,185,35,.45); }
  #credits-view .cmsg{ margin-top:26px; font-size:clamp(17px,4.6vw,21px); line-height:1.55;
    max-width:30ch; color:var(--bone); }
  #credits-view .cgg{ margin-top:22px; font-family:'Press Start 2P',monospace;
    font-size:clamp(14px,4.4vw,19px); color:#8fd14f; text-shadow:2px 2px 0 #000; }
  #credits-view .cfoot{ margin-top:34px; font-family:'Press Start 2P',monospace; font-size:10px;
    color:var(--steel-lt); animation:blink 1.2s steps(1) infinite; }

  .dpad{ position:relative; width:45vw; height:45vw; max-width:213px; max-height:213px; }
  .dpad-btn{ position:absolute; background:var(--steel-dk); border:2px solid #0a0a0c;
    box-shadow:0 3px 0 #000, inset 0 1px 0 rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center; color:#8a90a0; font-size:15px; }
  .dpad-btn.active{ background:var(--steel-lt); color:#fff; box-shadow:0 1px 0 #000 inset; }
  .dpad-up{ top:0; left:34%; width:32%; height:34%; border-radius:4px 4px 0 0; }
  .dpad-down{ bottom:0; left:34%; width:32%; height:34%; border-radius:0 0 4px 4px; }
  .dpad-left{ left:0; top:34%; height:32%; width:34%; border-radius:4px 0 0 4px; }
  .dpad-right{ right:0; top:34%; height:32%; width:34%; border-radius:0 4px 4px 0; }
  .dpad-center{ position:absolute; left:34%; top:34%; width:32%; height:32%; background:#0a0a0c; }

  .action-pad{ position:relative; width:45vw; height:45vw; max-width:213px; max-height:213px; }
  .action-btn{ position:absolute; width:30%; height:30%; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Press Start 2P',monospace; font-size:clamp(13px,3.4vw,17px);
    border:2px solid rgba(0,0,0,.5);
    box-shadow:0 3px 0 rgba(0,0,0,.6), inset 0 2px 3px rgba(255,255,255,.15); }
  .action-btn:active{ transform:translateY(2px); }
  .btn-triangle{ top:0; left:35%; background:#3fae6a; color:#0d2f18; }
  .btn-circle{ top:35%; right:0; background:#d1444a; color:#3a0d0f; }
  .btn-cross{ bottom:0; left:35%; background:#4c8fd6; color:#0d2340; }
  .btn-square{ top:35%; left:0; background:#c96fd0; color:#380a3c; }
  #controller-hint{ position:absolute; top:6px; left:0; right:0; text-align:center;
    font-size:12px; color:#57596a; letter-spacing:2px; pointer-events:none; }
</style>
</head>
<body>
<div id="app">
  <div id="scanlines"></div>
  <div id="vignette"></div>

  <div id="screen-start">
    <div class="logo">3DEVO OFFICE<br>FIGHTER</div>
    <div class="sub">A GOODBYE ARCADE</div>
    <div class="prompt">PRESS START</div>
    <div class="coin">TAP ANYWHERE</div>
  </div>

  <div id="screen-game" hidden>
    <div id="viewport-top">
      <canvas id="view"></canvas>

      <div id="hud" hidden>
        <div class="hp-block">
          <div class="hp-name" id="hp-name-p">MEHMET</div>
          <div class="hp-outer"><div class="hp-fill" id="hp-player"></div></div>
        </div>
        <div class="hp-block foe">
          <div class="hp-name" id="hp-name-e">KEBAB</div>
          <div class="hp-outer"><div class="hp-fill" id="hp-enemy"></div></div>
        </div>
      </div>
      <div class="round-mark" id="round-mark" hidden>ROUND 1</div>

      <div id="select-view">
        <div class="title">SELECT YOUR FIGHTER</div>
        <div class="vs-row">
          <div class="side">
            <div class="portrait-frame" id="portrait-frame"></div>
            <div class="side-label" id="char-name">MEHMET</div>
          </div>
          <div class="vs-text">VS</div>
          <div class="side">
            <div class="portrait-frame locked" id="enemy-frame"></div>
            <div class="side-label unknown" id="enemy-label">???</div>
          </div>
        </div>
        <div class="roster-strip" id="roster-strip"></div>
        <div class="hint-row"><span>✕ CONFIRM</span><span>○ BACK</span></div>
        <div class="credits-hint" id="credits-hint" hidden>△ CREDITS</div>
        <div id="toast"></div>
      </div>

      <div id="victory-view" hidden>
        <div class="ko">K.O.!</div>
        <div class="joke" id="victory-joke">MEHMET 1 &mdash; KEBAB 0.<br>THE SPIT SPINS NO MORE.</div>
        <div class="continue">PRESS ANY KEY TO CONTINUE</div>
      </div>
    </div>

    <div id="viewport-bottom">
      <div id="controller-hint">MOVE • FIGHT</div>
      <div class="dpad">
        <div class="dpad-btn dpad-up" data-dir="up">▲</div>
        <div class="dpad-btn dpad-down" data-dir="down">▼</div>
        <div class="dpad-btn dpad-left" data-dir="left">◂</div>
        <div class="dpad-btn dpad-right" data-dir="right">▸</div>
        <div class="dpad-center"></div>
      </div>
      <div class="action-pad">
        <div class="action-btn btn-triangle" data-action="jump">△</div>
        <div class="action-btn btn-circle" data-action="kick">○</div>
        <div class="action-btn btn-cross" data-action="punch">✕</div>
        <div class="action-btn btn-square" data-action="special">□</div>
      </div>
    </div>
  </div>
  <div id="credits-view" hidden>
    <div class="ctitle">3DEVO OFFICE<br>FIGHTER</div>
    <div class="cmsg" id="credits-msg"></div>
    <div class="cgg">GG WP</div>
    <div class="cfoot">TAP TO RETURN</div>
  </div>
</div>

/* ---- progress persistence (artifact storage -> localStorage -> memory) ---- */
var defeated = {};
var creditsSeen = false;
var memStore = null;
var STORE_KEY = 'of_defeated_v1';

function saveProgress(){
  var payload = JSON.stringify({ d: Object.keys(defeated), c: creditsSeen });
  try{
    if(window.storage && window.storage.set){
      window.storage.set(STORE_KEY, payload).catch(function(){});
      return;
    }
  }catch(e){}
  try{ window.localStorage.setItem(STORE_KEY, payload); return; }catch(e){}
  memStore = payload;
}

function loadProgress(done){
  function apply(str){
    defeated = {}; creditsSeen = false;
    try{
      var raw = JSON.parse(str || '{}');
      var arr = Array.isArray(raw) ? raw : (raw.d || []);
      for(var i=0;i<arr.length;i++) defeated[arr[i]] = true;
      creditsSeen = Array.isArray(raw) ? false : !!raw.c;
    }catch(e){}
    done();
  }
  try{
    if(window.storage && window.storage.get){
      window.storage.get(STORE_KEY).then(function(r){
        apply(r && r.value ? r.value : '[]');
      }).catch(function(){ apply('[]'); });
      return;
    }
  }catch(e){}
  try{ apply(window.localStorage.getItem(STORE_KEY)); return; }catch(e){}
  apply(memStore || '{}');
}

function allBeaten(){
  for(var i=0;i<roster.length;i++){
    if(!defeated[roster[i].id]) return false;
  }
  return true;
}

/* ================= CANVAS SETUP ================= */
var cv = document.getElementById('view');
var ctx = cv.getContext('2d');
var VW = 200, VH = 140, SCALE = 2;
var bgCanvas = document.createElement('canvas');

function resize(){
  var host = document.getElementById('viewport-top');
  var cw = host.clientWidth, chh = host.clientHeight;
  if(cw < 10 || chh < 10) return;
  SCALE = Math.max(1, Math.floor(cw / 200));
  VW = Math.floor(cw / SCALE);
  VH = Math.floor(chh / SCALE);
  cv.width = VW; cv.height = VH;
  cv.style.width = (VW*SCALE)+'px';
  cv.style.height = (VH*SCALE)+'px';
  ctx.imageSmoothingEnabled = false;
  buildBackground();
  layoutStage();
}
window.addEventListener('resize', resize);

/* ================= BACKGROUND (pixel art) ================= */
var GROUND_Y = 0;

function px(c, x, y, w, h, col){ c.fillStyle = col; c.fillRect(x|0, y|0, w|0, h|0); }

function cottage(c, x, y, w, h, wall, roof, dark){
  px(c, x, y, w, h, wall);
  px(c, x-2, y-Math.max(3,(h/3)|0), w+4, Math.max(3,(h/3)|0), roof);
  px(c, x-2, y-1, w+4, 1, dark);
  var winW = Math.max(2, (w/9)|0), gap = (w - winW*3) / 4;
  for(var i=0;i<3;i++){
    px(c, x + gap + i*(winW+gap), y + Math.max(2,(h/4)|0), winW, Math.max(2,(h/2.4)|0), dark);
  }
}

function cypress(c, x, baseY, hgt, col){
  for(var i=0;i<hgt;i++){
    var t = i/hgt;
    var wdt = Math.max(1, Math.round((1-t)*0.5 + 1.6*(1-Math.abs(t-0.35))));
    px(c, x - (wdt>>1), baseY - i, wdt, 1, col);
  }
}

function buildBackground(){
  bgCanvas.width = VW; bgCanvas.height = VH;
  var c = bgCanvas.getContext('2d');
  c.imageSmoothingEnabled = false;
  GROUND_Y = Math.floor(VH * 0.74);
  var st = activeChar && activeChar.stage;
  if(st === 'canteen'){ buildCanteen(c); canteenFloor(c); return; }
  if(st === 'tower'){ buildTower(c); towerFloor(c); return; }
  if(st === 'terschelling'){ buildTerschelling(c); terschellingFloor(c); return; }
  if(st === 'chess'){ buildChessClub(c); chessFloor(c); return; }
  if(st === 'climb'){ buildClimbGym(c); climbFloor(c); return; }
  if(st === 'track'){ buildTrack(c); trackFloor(c); return; }
  if(st === 'workshop'){ buildWorkshop(c); workshopFloor(c); return; }
  buildHill(c);
}

function buildHill(c){
  var skyTop = [128,146,164], skyBot = [214,220,218];
  for(var y=0;y<GROUND_Y;y++){
    var t = y/GROUND_Y;
    var r = Math.round(skyTop[0]+(skyBot[0]-skyTop[0])*t);
    var g = Math.round(skyTop[1]+(skyBot[1]-skyTop[1])*t);
    var b = Math.round(skyTop[2]+(skyBot[2]-skyTop[2])*t);
    px(c, 0, y, VW, 1, 'rgb('+r+','+g+','+b+')');
  }

  var hillTop = Math.floor(VH*0.10);
  for(var x=0;x<VW;x++){
    var hy = hillTop
      + Math.round(6*Math.sin(x*0.055))
      + Math.round(4*Math.sin(x*0.021+1.7))
      + Math.round(2*Math.sin(x*0.13+0.4));
    px(c, x, hy, 1, GROUND_Y-hy, '#2b3527');
    px(c, x, hy, 1, 2, '#3d4a35');
  }

  var farY = Math.floor(VH*0.30);
  for(var i=0;i<6;i++){
    var fx = 6 + i*(VW/5.6);
    cypress(c, (fx|0), farY+4, 13, '#1b2419');
  }
  for(var j=0;j<5;j++){
    var cx = -4 + j*(VW/4.4);
    cottage(c, (cx|0), farY, 26, 11, '#cfcabd', '#8a4a30', '#2b2621');
  }

  var midY = Math.floor(VH*0.47);
  for(var k=0;k<4;k++){
    var mx = 8 + k*(VW/3.7);
    cypress(c, (mx|0), midY+2, 17, '#16200f');
  }
  for(var m=0;m<4;m++){
    var mx2 = -8 + m*(VW/3.3);
    cottage(c, (mx2|0), midY, 38, 16, '#e6e0d2', '#a85c38', '#241f1a');
  }

  var nearY = Math.floor(VH*0.60);
  for(var n=0;n<3;n++){
    var nx = -14 + n*(VW/2.5);
    cottage(c, (nx|0), nearY, 54, GROUND_Y-nearY, '#f2ece0', '#b0603a', '#1e1a16');
  }

  px(c, 0, GROUND_Y-2, VW, 2, '#241f19');
  for(var gy=GROUND_Y; gy<VH; gy++){
    var gt = (gy-GROUND_Y)/(VH-GROUND_Y);
    var gr = Math.round(150-60*gt), gg = Math.round(138-58*gt), gb = Math.round(116-52*gt);
    px(c, 0, gy, VW, 1, 'rgb('+gr+','+gg+','+gb+')');
  }
  c.globalAlpha = .18;
  for(var s=-3;s<=3;s++){
    var topX = VW/2 + s*4;
    var botX = VW/2 + s*46;
    for(var yy=GROUND_Y; yy<VH; yy++){
      var tt = (yy-GROUND_Y)/(VH-GROUND_Y);
      px(c, Math.round(topX+(botX-topX)*tt), yy, 1, 1, '#2e281f');
    }
  }
  for(var b2=0;b2<3;b2++){
    var by = GROUND_Y + Math.round((VH-GROUND_Y)*(0.25+b2*0.28));
    px(c, 0, by, VW, 1, '#2e281f');
  }
  c.globalAlpha = 1;
}

/* ================= CHESS CLUB BACKGROUND ================= */
function buildChessClub(c){
  for(var y=0;y<GROUND_Y;y++){
    var t = y/GROUND_Y;
    var v = Math.round(58+22*t);
    px(c, 0, y, VW, 1, 'rgb('+v+','+Math.round(v*0.86)+','+Math.round(v*0.7)+')');
  }
  for(var p=0;p<3;p++){
    var px2 = Math.floor(VW*(0.14+p*0.36));
    px(c, px2-1, 0, 2, GROUND_Y-14, '#1c1712');
    px(c, px2-4, Math.floor(VH*0.10), 8, 3, '#c9a24a');
  }
  for(var sh=0;sh<2;sh++){
    var sx = Math.floor(VW*(0.06+sh*0.72));
    var sy = Math.floor(VH*0.16);
    var sw2 = Math.floor(VW*0.2), shH = Math.floor(VH*0.36);
    px(c, sx, sy, sw2, shH, '#2c2016');
    for(var r=0;r<4;r++){
      px(c, sx+2, sy+4+r*(shH/4|0), sw2-4, 3, '#4a3624');
    }
  }
  px(c, 0, GROUND_Y-16, VW, 4, '#1c1712');
}

function chessFloor(c){
  var tile = 14;
  for(var gy=GROUND_Y; gy<VH; gy++){
    for(var gx=0; gx<VW; gx++){
      var col = (((gx/tile)|0) + ((gy-GROUND_Y)/tile|0)) % 2;
      var shade = col ? '#2a2620' : '#c9bfa4';
      var depthFade = (gy-GROUND_Y)/(VH-GROUND_Y);
      if(col){
        px(c, gx, gy, 1, 1, shade);
      } else {
        var v = Math.round(201-40*depthFade);
        px(c, gx, gy, 1, 1, 'rgb('+v+','+Math.round(v*0.95)+','+Math.round(v*0.82)+')');
      }
    }
  }
  px(c, 0, GROUND_Y-2, VW, 2, '#12100c');
}

/* ================= CHESS QUEEN ENEMY ================= */
function drawQueen(c, cx, baseY, fullness, flash, t){
  var h = Math.round(72 * (0.4 + 0.6*fullness));
  var topY = baseY - h;
  var ivory = flash ? '#ffffff' : '#e8e2d0';
  var shadow = flash ? '#f0e8d8' : '#b5ab8e';

  px(c, cx-16, baseY-6, 32, 6, shadow);
  px(c, cx-14, baseY-10, 28, 5, ivory);

  var bodyTop = topY + 16, bodyH = h - 30;
  for(var i=0;i<bodyH;i++){
    var tt = i/bodyH;
    var half = Math.round(6 + 8*Math.sin(Math.PI*tt*0.7));
    px(c, cx-half, bodyTop+i, half*2, 1, ivory);
    px(c, cx-half, bodyTop+i, 1, 1, shadow);
  }
  px(c, cx-9, topY+8, 18, 10, ivory);
  px(c, cx-9, topY+8, 18, 2, shadow);

  var crownY = topY;
  px(c, cx-11, crownY+8, 22, 6, ivory);
  for(var pk=0;pk<5;pk++){
    var pkx = cx-10+pk*5;
    px(c, pkx, crownY, 3, 9, ivory);
    px(c, pkx+1, crownY-2, 1, 2, shadow);
  }

  if(fullness < 0.7){
    px(c, cx-4, bodyTop+Math.round(bodyH*0.3), 3, 8, '#8a8064');
  }
  if(fullness < 0.4){
    px(c, cx+2, bodyTop+Math.round(bodyH*0.5), 4, 10, '#8a8064');
    px(c, cx-9, crownY+6, 3, 3, '#8a8064');
  }
}

/* ================= TERSCHELLING BACKGROUND ================= */
function buildTerschelling(c){
  var skyTop = [176,206,224], skyBot = [222,232,224];
  for(var y=0;y<GROUND_Y;y++){
    var t = y/GROUND_Y;
    var r = Math.round(skyTop[0]+(skyBot[0]-skyTop[0])*t);
    var g = Math.round(skyTop[1]+(skyBot[1]-skyTop[1])*t);
    var b = Math.round(skyTop[2]+(skyBot[2]-skyTop[2])*t);
    px(c, 0, y, VW, 1, 'rgb('+r+','+g+','+b+')');
  }
  for(var cl=0; cl<4; cl++){
    var clx = (cl*61 + 14) % VW, cly = Math.floor(VH*0.14) + (cl%2)*8;
    px(c, clx, cly, 20, 5, '#f5f6f2');
    px(c, clx+4, cly-3, 12, 4, '#f5f6f2');
  }

  var seaY = Math.floor(VH*0.44);
  for(var y2=seaY; y2<GROUND_Y-10; y2++){
    var t2 = (y2-seaY)/(GROUND_Y-10-seaY);
    px(c, 0, y2, VW, 1, 'rgb('+Math.round(90-20*t2)+','+Math.round(130-24*t2)+','+Math.round(150-20*t2)+')');
  }

  var lhX = Math.floor(VW*0.66);
  var lhBase = seaY - 2;
  px(c, lhX-6, lhBase-46, 12, 46, '#8a6a4a');
  px(c, lhX-6, lhBase-46, 4, 46, '#a6825c');
  px(c, lhX-8, lhBase-50, 16, 6, '#c0392b');
  px(c, lhX-5, lhBase-49, 10, 3, '#2b2622');
  for(var b3=0;b3<3;b3++){
    px(c, lhX-6, lhBase-40+b3*13, 12, 1, '#5a4534');
  }

  for(var h2=0;h2<7;h2++){
    var hx = lhX - 40 + h2*11;
    var hh = 6 + (h2%3)*2;
    px(c, hx, lhBase-hh, 9, hh, '#e9e4d6');
    px(c, hx-1, lhBase-hh-3, 11, 3, '#9c5636');
  }

  var duneY = GROUND_Y - 26;
  for(var x=0;x<VW;x++){
    var dy = duneY
      + Math.round(5*Math.sin(x*0.05))
      + Math.round(3*Math.sin(x*0.13+1.1));
    px(c, x, dy, 1, GROUND_Y-dy, '#c7b686');
    px(c, x, dy, 1, 2, '#d8c99a');
  }
  for(var g2=0; g2<26; g2++){
    var gx = (g2*23 + 9) % VW;
    var gy = duneY + Math.round(4*Math.sin(gx*0.05)) - 1;
    px(c, gx, gy-5, 1, 5, '#7a8a4a');
    px(c, gx+1, gy-4, 1, 4, '#8a9a56');
    px(c, gx-1, gy-3, 1, 3, '#6f7d42');
  }

  px(c, 0, GROUND_Y-2, VW, 2, '#b0a074');
}

function terschellingFloor(c){
  for(var gy=GROUND_Y; gy<VH; gy++){
    var gt = (gy-GROUND_Y)/(VH-GROUND_Y);
    var v = Math.round(214-70*gt);
    px(c, 0, gy, VW, 1, 'rgb('+v+','+(v-8)+','+(v-40)+')');
  }
  c.globalAlpha = .16;
  for(var s=-4;s<=4;s++){
    var topX = VW/2 + s*5, botX = VW/2 + s*50;
    for(var yy=GROUND_Y; yy<VH; yy++){
      var tt = (yy-GROUND_Y)/(VH-GROUND_Y);
      px(c, Math.round(topX+(botX-topX)*tt), yy, 1, 1, '#8a7748');
    }
  }
  for(var b=0;b<3;b++){
    px(c, 0, GROUND_Y + Math.round((VH-GROUND_Y)*(0.26+b*0.28)), VW, 1, '#8a7748');
  }
  c.globalAlpha = 1;
}

/* ================= CRATE ENEMY ================= */
function drawCrate(c, cx, baseY, fullness, flash, t){
  var w = 46, h = Math.round(60 * (0.35 + 0.65*fullness));
  var topY = baseY - h;
  var wood = flash ? '#ffffff' : '#a5763f';
  var woodDk = flash ? '#f0e8d8' : '#7a5228';
  var woodLt = flash ? '#ffffff' : '#c08f52';

  px(c, cx-w/2, topY, w, h, wood);
  px(c, cx-w/2, topY, w, 4, woodLt);
  for(var p=1;p<4;p++){
    px(c, cx-w/2, topY + Math.round(h*p/4), w, 2, woodDk);
  }
  px(c, cx-w/2, topY, 4, h, woodDk);
  px(c, cx+w/2-4, topY, 4, h, woodDk);

  px(c, cx-w/2-3, topY-3, 4, h+6, '#5a3c1e');
  px(c, cx+w/2-1, topY-3, 4, h+6, '#5a3c1e');
  px(c, cx-w/2-3, topY+Math.round(h*0.5)-2, w+7, 4, '#5a3c1e');

  if(!flash){
    c.fillStyle = '#2b2016';
    c.font = '7px monospace';
    c.fillText('FRAGILE', cx-16, topY+Math.round(h*0.42));
  }

  if(fullness < 0.75){
    px(c, cx-6, topY+8, 10, 2, woodDk);
    px(c, cx+2, topY+18, 2, 10, woodDk);
  }
  if(fullness < 0.45){
    px(c, cx-14, topY+22, 2, 14, woodDk);
    px(c, cx+8, topY+30, 12, 2, woodDk);
    px(c, cx-2, topY+2, 2, 12, woodDk);
  }
  if(fullness < 0.2){
    px(c, cx-w/2+2, topY+2, w-4, 2, '#3a2814');
  }
}

/* ================= RACE TRACK BACKGROUND ================= */
function buildTrack(c){
  var skyTop=[110,150,200], skyBot=[200,215,225];
  var horiz = Math.floor(VH*0.42);
  for(var y=0;y<horiz;y++){
    var t=y/horiz;
    px(c,0,y,VW,1,'rgb('+Math.round(skyTop[0]+(skyBot[0]-skyTop[0])*t)+','+
       Math.round(skyTop[1]+(skyBot[1]-skyTop[1])*t)+','+Math.round(skyTop[2]+(skyBot[2]-skyTop[2])*t)+')');
  }
  px(c,0,horiz,VW,GROUND_Y-horiz,'#5c6a52');
  for(var st=0;st<6;st++){
    var stx = (st*33+8)%VW;
    px(c, stx, horiz-3, 3, 10, '#7a828c');
    px(c, stx-3, horiz-6, 9, 4, '#c0392b');
  }
  var gsY = horiz+6;
  px(c, 0, gsY, VW, 14, '#6a6f78');
  for(var gr=0; gr<VW; gr+=6){
    px(c, gr, gsY, 3, 14, '#565a62');
  }
  px(c, 0, GROUND_Y-2, VW, 2, '#33363c');
}
function trackFloor(c){
  for(var gy=GROUND_Y; gy<VH; gy++){
    px(c,0,gy,VW,1,'#3a3d42');
  }
  px(c, 0, GROUND_Y, VW, 4, '#e8e4d8');
  for(var d=0; d<VW; d+=10){
    px(c, d, GROUND_Y+Math.round((VH-GROUND_Y)/2), 6, 3, '#e8e4d8');
  }
  c.globalAlpha=.18;
  for(var s=-4;s<=4;s++){
    var topX=VW/2+s*5, botX=VW/2+s*50;
    for(var yy=GROUND_Y;yy<VH;yy++){
      var tt=(yy-GROUND_Y)/(VH-GROUND_Y);
      px(c, Math.round(topX+(botX-topX)*tt), yy, 1,1,'#1c1e20');
    }
  }
  c.globalAlpha=1;
}

/* ================= RACE CAR ENEMY ================= */
function drawRaceCar(c, cx, baseY, fullness, flash, t){
  var scale = 0.4 + 0.6*fullness;
  var w = Math.round(66*scale), h = Math.round(40*scale);
  var topY = baseY - h - 6;
  var body = flash ? '#ffffff' : '#2455a4';
  var body2 = flash ? '#f0f0ff' : '#3f86bd';
  var white = flash ? '#ffffff' : '#eef0f2';

  px(c, cx-w/2, topY+Math.round(h*0.35), w, Math.round(h*0.5), body);
  px(c, cx-Math.round(w*0.32), topY, Math.round(w*0.64), Math.round(h*0.4), body2);
  px(c, cx-Math.round(w*0.28), topY+2, Math.round(w*0.56), Math.round(h*0.22), '#1a2230');
  px(c, cx-w/2, topY+Math.round(h*0.4), w, 3, white);

  px(c, cx-w/2-2, baseY-10, 12, 10, '#1a1a1a');
  px(c, cx+w/2-10, baseY-10, 12, 10, '#1a1a1a');
  px(c, cx-w/2, baseY-7, 12, 4, '#4a4a4a');
  px(c, cx+w/2-8, baseY-7, 12, 4, '#4a4a4a');

  px(c, cx-w/2-4, topY+Math.round(h*0.42), 4, 6, '#111');
  px(c, cx+w/2, topY+Math.round(h*0.42), 4, 6, '#111');

  if(fullness < 0.7){
    px(c, cx-6, topY+Math.round(h*0.5), 10, 2, '#0d1a2e');
  }
  if(fullness < 0.4){
    for(var s2=0;s2<3;s2++){
      px(c, cx-14+ (t*1.3+s2*8|0)%28, baseY-h-10-s2*4, 3, 3, '#888');
    }
  }
}

/* ================= WIZARD TOWER BACKGROUND ================= */
function buildTower(c){
  px(c, 0, 0, VW, GROUND_Y, '#3a3a44');

  var bh = 9, bw = 20;
  for(var row=0; row*bh < GROUND_Y; row++){
    var off = (row % 2) ? -bw/2 : 0;
    for(var col=-1; col*bw + off < VW; col++){
      var bx = col*bw + off, by = row*bh;

/* ================= THE WIZARD ENEMY ================= */
function drawWizard(c, cx, baseY, fullness, flash, t){
  var bob = Math.round(Math.sin(t*0.045) * 3);
  var h = WIZ.length, w = WIZ[0].length;
  var ox = cx - Math.round(w/2);
  var oy = baseY - h + bob - 2;

  var cut = Math.floor((1 - fullness) * (h * 0.55));

  c.globalAlpha = 0.18 + 0.1*Math.sin(t*0.08);
  px(c, cx-16, oy+18, 32, 34, '#7a5fae');
  c.globalAlpha = 1;

  for(var y=0; y<h-cut; y++){
    var row = WIZ[y];
    for(var x=0; x<w; x++){
      var ch = row[x];
      if(ch === '.') continue;
      var col = flash ? '#ffffff' : WIZ_PAL[ch];
      if(ch === 'y'){
        col = flash ? '#ffffff' : (((t/7)|0) % 2 ? '#a8f4e6' : '#7de3d0');
      }
      c.fillStyle = col;
      c.fillRect(ox+x, oy+y, 1, 1);
    }
  }

  var sh = WIZ_STAFF.length, sw = WIZ_STAFF[0].length;
  var sx = cx + 18, sy = baseY - sh - 2 + bob;
  for(var yy2=0; yy2<sh; yy2++){
    for(var xx=0; xx<sw; xx++){
      var c2 = WIZ_STAFF[yy2][xx];
      if(c2 === '.') continue;
      var cc2 = WIZ_PAL[c2];
      if(c2 === 'O' || c2 === 'y'){
        cc2 = (((t/5)|0) % 2) ? '#b6f6ea' : '#8be8d6';
      }
      c.fillStyle = flash ? '#ffffff' : cc2;
      c.fillRect(sx+xx, sy+yy2, 1, 1);
    }
  }

  if(fullness < 1){
    for(var m2=0;m2<4;m2++){
      var my = oy + h - cut - 2 - m2*3;
      var mx = cx - 10 + ((t*0.7 + m2*9)|0) % 20;
      c.fillStyle = '#7a5fae';
      c.fillRect(mx, my, 2, 2);
    }
  }
}

/* ================= 3D PRINTER PILE (Prusa i3-style, front view) ================= */
function drawPrusaUnit(c, cx, baseY, alive, flash, t, phase){
  var frame = flash ? '#ffffff' : '#2b2d31';
  var frameLt = flash ? '#ffffff' : '#3d4046';
  var rod = flash ? '#f0f0f0' : '#c7ccd1';
  var orange = flash ? '#ffffff' : '#f2811d';
  var screenOn = flash ? '#ffffff' : (alive ? '#3fd4b0' : '#3a1414');

  var baseW = 30, baseH = 8;
  var railH = 27;
  var topY = baseY - baseH - railH;

  px(c, cx-baseW/2, baseY-baseH, baseW, baseH, frame);
  px(c, cx-baseW/2, baseY-baseH, baseW, 2, frameLt);
  px(c, cx-baseW/2, baseY-baseH, baseW, 1, orange);

  px(c, cx-11, baseY-baseH+2, 9, 4, screenOn);
  px(c, cx-1, baseY-baseH+3, 1, 2, alive ? '#8a8f96' : '#3a1414');

  px(c, cx-baseW/2+2, topY, 2, railH+baseH-2, rod);
  px(c, cx+baseW/2-4, topY, 2, railH+baseH-2, rod);

  px(c, cx-baseW/2, topY-4, baseW, 5, frame);
  px(c, cx-baseW/2, topY-4, baseW, 1, frameLt);

  px(c, cx-3, topY-11, 6, 7, orange);
  px(c, cx-1, topY-13, 2, 2, '#8a5a20');

  if(alive){
    var sway = Math.sin(t*0.05 + phase) * 8;
    var hx = cx + sway;
    px(c, hx-4, topY+6, 8, 8, frame);
    px(c, hx-3, topY+7, 6, 4, orange);
    px(c, hx-1, topY+14, 2, 4, '#8a8f96');
  } else {
    px(c, cx-4, topY+6, 8, 8, '#1a1a1c');
    for(var sp=0;sp<2;sp++){
      px(c, cx-6+((t*0.8+sp*6)|0)%12, topY-2-sp*4, 2, 2, '#888');
    }
  }
}

function drawPrinterPile(c, cx, baseY, fullness, flash, t){
  var count = Math.max(1, Math.round(3*fullness));
  var offsets = [-32, 0, 32];
  var phases = [0, 1.4, 2.8];
  for(var i=0;i<3;i++){
    drawPrusaUnit(c, cx+offsets[i], baseY, i < count, flash, t, phases[i]);
  }
}

/* ================= KEBAB ENEMY (procedural sprite) ================= */
var KEB_W = 34, KEB_H = 74;

function drawKebab(c, cx, baseY, fullness, flash, t){
  var topY = baseY - KEB_H;
  px(c, cx-1, topY-6, 2, KEB_H+4, '#9aa0a8');
  px(c, cx-1, topY-7, 3, 2, '#c9ced4');

  var meatTop = topY + 4, meatH = KEB_H - 20;
  for(var i=0;i<meatH;i++){
    var tt = i/meatH;
    var prof = Math.sin(Math.PI*Math.pow(tt,0.62));
    var half = Math.round((2 + prof*13) * (0.35 + 0.65*fullness));
    if(half < 1) continue;
    var y = meatTop + i;
    var band = (i + ((t*0.6)|0)) % 5;
    var base = band < 2 ? '#b5762f' : (band < 4 ? '#a2661f' : '#c08a3c');
    if(i < 3) base = '#5d3512';
    px(c, cx-half, y, half*2, 1, flash ? '#ffe9c9' : base);
    px(c, cx-half, y, 1, 1, flash ? '#ffe9c9' : '#6b3d15');
    px(c, cx+half-1, y, 1, 1, flash ? '#ffe9c9' : '#7c4a1c');
    if(i % 7 === 3 && half > 4){
      px(c, cx-half+2, y, 2, 1, '#e0aa5e');
    }
  }

  px(c, cx-13, baseY-11, 26, 3, '#5c626b');
  px(c, cx-16, baseY-8, 32, 4, '#3d434b');
  px(c, cx-18, baseY-4, 36, 4, '#2b3038');
  for(var f=0;f<7;f++){
    var fx = cx-15 + f*5;
    var fh = 2 + ((t*0.35 + f*2)|0) % 3;
    px(c, fx, baseY-14-fh, 2, fh, f%2 ? '#f2872b' : '#e2551f');
  }
}

function setBar(el, pct){
  el.style.width = Math.max(0,pct)+'%';
  el.style.background = pct>50 ? 'var(--hp-green)' : (pct>20 ? 'var(--hp-yellow)' : 'var(--hp-red)');
}

var REACH = 46;
function inRange(){
  var d = enemy.x - (player.x + FW/2);
  return d > 0 && d < REACH;
}

function doAttack(kind){
  if(mode!=='fight' || enemy.dead || player.action) return;
  player.action = kind; player.timer = 0;
  player.frame = kind==='punch' ? 'punch' : (kind==='kick' ? 'kick' : 'special');
  var hit = inRange();
  if(hit){
    if(kind==='punch') SFX.punch(); else if(kind==='kick') SFX.kick(); else SFX.special();
    enemy.hp = Math.max(0, enemy.hp - 10);
    enemy.fullness = Math.max(0, enemy.hp/100);
    enemy.flash = 6;
    setBar(document.getElementById('hp-enemy'), enemy.hp);
    for(var i=0;i<7;i++){
      sparks.push({ x:enemy.x-8+Math.random()*10, y:GROUND_Y-40-Math.random()*22,
        vx:-(0.6+Math.random()*1.4), vy:-(0.5+Math.random()*1.2), life:16+Math.random()*10 });
    }
    pops.push({ x:enemy.x-16, y:GROUND_Y-56, life:34, txt:'-10' });
    if(enemy.hp<=0 && !enemy.dead){
      enemy.dead = true;
      setTimeout(goVictory, 900);
    }
  } else {
    SFX.whiff();
  }
}

function doJump(){
  if(mode!=='fight' || player.y < 0 || player.action) return;
  player.vy = -3.1; SFX.jump();
}

/* ================= LOOP ================= */
function step(){
  tick++;

  if(mode==='fight'){
    if(heldDir && !player.action && player.y===0){
      var sp = 1.15;
      if(heldDir==='left'){ player.x = Math.max(2, player.x - sp); player.walkPhase += .28; }
      if(heldDir==='right'){ player.x = Math.min(enemy.x - 52, player.x + sp); player.walkPhase += .28; }
      if(((player.walkPhase*2)|0) % 4 === 0) SFX.step();
    }
    if(player.vy !== 0 || player.y < 0){
      player.vy += 0.19;
      player.y += player.vy;
      if(player.y >= 0){ player.y = 0; player.vy = 0; }
    }
    if(player.action){
      player.timer++;
      if(player.timer > 15){ player.action = null; player.timer = 0; }
    }
    if(!player.action){
      if(player.y < 0) player.frame = 'jump';
      else if(heldDir) player.frame = (((player.walkPhase)|0) % 2) ? 'walk' : 'idle';
      else player.frame = 'idle';
    }
    if(enemy.flash > 0) enemy.flash--;
    if(enemy.dead) enemy.fallT = Math.min(1, enemy.fallT + 0.028);
  }

  render();
  requestAnimationFrame(step);
}

function render(){
  if(mode!=='fight' && mode!=='victory'){ return; }
  ctx.clearRect(0,0,VW,VH);
  ctx.drawImage(bgCanvas, 0, 0);

  var baseY = GROUND_Y + 4;

  var fk = activeChar && activeChar.foe;
  var foe = fk === 'table' ? drawTable : (fk === 'wizard' ? drawWizard :
            (fk === 'crate' ? drawCrate : (fk === 'queen' ? drawQueen :
            (fk === 'wall' ? drawClimbWall : (fk === 'car' ? drawRaceCar :
            (fk === 'printers' ? drawPrinterPile : drawKebab))))));
  ctx.save();
  if(enemy.dead){
    var ft = enemy.fallT;
    ctx.translate(enemy.x, baseY);
    ctx.rotate(ft * 1.35);
    ctx.globalAlpha = 1 - ft*0.45;
    foe(ctx, 0, 0, enemy.fullness*(1-ft*0.6), false, tick);
  } else {
    foe(ctx, enemy.x, baseY, enemy.fullness, enemy.flash>3, tick);
  }
  ctx.restore();

  var bob = (mode==='fight' && !player.action && !heldDir && player.y===0)
    ? (((tick/26)|0) % 2) : 0;
  var isGhost = activeChar && activeChar.id === 'jeroen';
  if(isGhost) ctx.globalAlpha = 0.5;
  drawSprite(ctx, player.frame, Math.round(player.x), Math.round(baseY - FH + player.y + bob), false);
  if(isGhost) ctx.globalAlpha = 1;

  for(var i=sparks.length-1;i>=0;i--){
    var s = sparks[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.08; s.life--;
    if(s.life<=0){ sparks.splice(i,1); continue; }
    ctx.fillStyle = s.life > 9 ? '#f0c489' : '#a2661f';
    ctx.fillRect(s.x|0, s.y|0, 2, 2);
  }

  ctx.font = '8px monospace';
  for(var p=pops.length-1;p>=0;p--){
    var po = pops[p];
    po.y -= 0.55; po.life--;
    if(po.life<=0){ pops.splice(p,1); continue; }
    ctx.fillStyle = '#000';
    ctx.fillText(po.txt, (po.x|0)+1, (po.y|0)+1);
    ctx.fillStyle = '#e8b923';
    ctx.fillText(po.txt, po.x|0, po.y|0);
  }
}

/* ================= SELECT SCREEN ================= */
var portraitFrame = document.getElementById('portrait-frame');
var charName = document.getElementById('char-name');
var rosterStrip = document.getElementById('roster-strip');

function spriteCanvas(scale, x0, y0, x1, y1, charId){
  var cid = charId || 'mehmet';
  var set = SPRITES[cid] || SPRITES.mehmet;
  var pal = PALETTES[cid] || PALETTES.mehmet;
  var c = document.createElement('canvas');
  var rows = set['idle'].slice(y0, y1);
  var w = x1-x0, h = rows.length;
  c.width = w*scale; c.height = h*scale;
  var cc = c.getContext('2d');
  cc.imageSmoothingEnabled = false;
  if(cid === 'jeroen') cc.globalAlpha = 0.65;
  for(var y=0;y<h;y++){
    for(var x=0;x<w;x++){
      var ch = rows[y][x0+x];
      if(ch===undefined || ch==='.') continue;
      cc.fillStyle = pal[ch] || '#ff00ff';
      cc.fillRect(x*scale, y*scale, scale, scale);
    }
  }
  c.style.width='100%'; c.style.height='auto';
  return c;
}

for(var i=0;i<roster.length;i++){
  var d = document.createElement('div');
  d.className = 'roster-thumb' + (i===0?' active':'');
  if(roster[i].ready){
    d.appendChild(spriteCanvas(1, 14, 0, 34, 20, roster[i].id));
  } else {
    var q = document.createElement('div'); q.className='q'; q.textContent='?';
    d.appendChild(q);
  }
  rosterStrip.appendChild(d);
}

var enemyFrame = document.getElementById('enemy-frame');
var enemyLabel = document.getElementById('enemy-label');

function renderSelect(){
  var c = roster[selIndex];
  var beaten = !!defeated[c.id];

  portraitFrame.className = 'portrait-frame' + (c.ready ? '' : ' locked');
  portraitFrame.innerHTML = '';
  if(c.ready){
    portraitFrame.appendChild(spriteCanvas(3, 7, 0, 41, 37, c.id));
  } else {
    var q = document.createElement('div'); q.className='qmark'; q.textContent='?';
    portraitFrame.appendChild(q);
  }
  charName.textContent = c.name;

  enemyFrame.innerHTML = '';
  if(beaten){
    enemyFrame.className = 'portrait-frame beaten';
    if(c.id === 'mehmet'){
      enemyFrame.appendChild(foePortrait('kebab'));
    } else if(c.id === 'lukas'){
      enemyFrame.appendChild(foePortrait('table'));
    } else if(c.id === 'matthijs'){
      enemyFrame.appendChild(foePortrait('wizard'));
    } else if(c.id === 'jeroen'){
      enemyFrame.appendChild(foePortrait('crate'));
    } else if(c.id === 'mehdi'){
      enemyFrame.appendChild(foePortrait('queen'));
    } else if(c.id === 'stevens'){
      enemyFrame.appendChild(foePortrait('wall'));
    } else if(c.id === 'kay'){
      enemyFrame.appendChild(foePortrait('car'));
    } else if(c.id === 'sander'){
      enemyFrame.appendChild(foePortrait('printers'));
    } else {
      var mark = document.createElement('div');
      mark.className = 'qmark'; mark.style.color = '#8fd14f'; mark.textContent = '✓';
      enemyFrame.appendChild(mark);
    }
    enemyLabel.className = 'side-label';
    enemyLabel.textContent = c.enemy;
  } else {
    enemyFrame.className = 'portrait-frame locked';
    var q2 = document.createElement('div'); q2.className='qmark'; q2.textContent='?';
    enemyFrame.appendChild(q2);
    enemyLabel.className = 'side-label unknown';
    enemyLabel.textContent = '???';
  }

  var ch = document.getElementById('credits-hint');
  if(ch) ch.hidden = !creditsSeen;

  for(var i=0;i<rosterStrip.children.length;i++){
    var th = rosterStrip.children[i];
    th.classList.toggle('active', i===selIndex);
    var isDone = !!defeated[roster[i].id];
    th.classList.toggle('done', isDone);
    var tick = th.querySelector('.tick');
    if(isDone && !tick){
      var tk = document.createElement('div'); tk.className='tick'; tk.textContent='✓';
      th.appendChild(tk);
    } else if(!isDone && tick){ tick.remove(); }
  }
}

function foePortrait(kind){
  var c = document.createElement('canvas');
  var dims = {
    table:[74,92], wizard:[52,70], crate:[60,70], queen:[36,80],
    wall:[64,100], car:[70,50], printers:[112,74]
  };
  var d2 = dims[kind] || [38,84];
  c.width = d2[0]; c.height = d2[1];
  var cc = c.getContext('2d');
  cc.imageSmoothingEnabled = false;
  if(kind==='table'){ drawTable(cc, 30, 90, 1, false, 0); }
  else if(kind==='wizard'){ drawWizard(cc, 22, 70, 1, false, 0); }
  else if(kind==='crate'){ drawCrate(cc, 30, 68, 1, false, 0); }
  else if(kind==='queen'){ drawQueen(cc, 18, 78, 1, false, 0); }
  else if(kind==='wall'){ drawClimbWall(cc, 32, 98, 1, false, 0); }
  else if(kind==='car'){ drawRaceCar(cc, 35, 46, 1, false, 0); }
  else if(kind==='printers'){ drawPrinterPile(cc, 56, 66, 1, false, 0); }
  else { drawKebab(cc, 19, 82, 1, false, 0); }
  c.style.width='100%'; c.style.height='auto';
  return c;
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('show');
  void t.offsetWidth; t.classList.add('show');
}

/* ================= SCREEN FLOW ================= */
var elStart = document.getElementById('screen-start');
var elGame = document.getElementById('screen-game');
var elSelect = document.getElementById('select-view');
var elVictory = document.getElementById('victory-view');
var elHud = document.getElementById('hud');
var elRound = document.getElementById('round-mark');

function goStart(){
  mode='start';
  heldDir = null;
  elStart.hidden=false; elGame.hidden=true;
  elSelect.hidden=false; elVictory.hidden=true;
  elHud.hidden=true; elRound.hidden=true;
  selIndex=0; renderSelect();
}
function goSelect(){
  mode='select';
  heldDir = null;
  elStart.hidden=true; elGame.hidden=false;
  elSelect.hidden=false; elVictory.hidden=true;
  elHud.hidden=true; elRound.hidden=true;
  resize(); renderSelect();
}
function goFight(){
  mode='fight';
  heldDir = null;
  activeChar = roster[selIndex];
  FRAMES = SPRITES[activeChar.id] || SPRITES.mehmet;
  PAL = PALETTES[activeChar.id] || PALETTES.mehmet;
  document.getElementById('hp-name-p').textContent = activeChar.name;
  document.getElementById('hp-name-e').textContent = activeChar.enemy.replace('THE ','');
  elSelect.hidden=true; elVictory.hidden=true;
  elHud.hidden=false; elRound.hidden=false;
  resize(); resetFight();
}
var elCredits = document.getElementById('credits-view');

function goVictory(){
  mode='victory';
  var vc = activeChar || roster[selIndex];
  document.getElementById('victory-joke').innerHTML =
    vc.win || (vc.name + ' WINS.<br>' + vc.enemy + ' DOES NOT.');
  elVictory.hidden=false;
  defeated[roster[selIndex].id] = true;
  saveProgress();
  SFX.victory();
}

function goCredits(){
  mode='credits';
  heldDir = null;
  if(!creditsSeen){ creditsSeen = true; saveProgress(); }
  document.getElementById('credits-msg').textContent = CREDITS_MSG;
  elCredits.hidden = false;
  SFX.victory();
}

/* ================= INPUT ================= */
elStart.addEventListener('pointerdown', function(){
  unlockAudio(); SFX.confirm(); goSelect();
});

var triTaps = [];
var sqTaps = [];
var lastSel = 0;
function selectMove(dir){
  var now = Date.now();
  if(now - lastSel < 170) return;
  lastSel = now;
  selIndex = dir==='left' ? (selIndex-1+roster.length)%roster.length
                          : (selIndex+1)%roster.length;
  renderSelect(); SFX.move();
}

var dpads = document.querySelectorAll('.dpad-btn');
for(var di=0; di<dpads.length; di++){
  (function(btn){
    var dir = btn.dataset.dir;
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault(); btn.classList.add('active');
      if(mode==='select'){ if(dir==='left'||dir==='right') selectMove(dir); }
      else if(mode==='fight'){ if(dir==='left'||dir==='right') heldDir = dir; }
      else if(mode==='victory'){ continueFromVictory(); }
    });
    function release(){ btn.classList.remove('active'); if(heldDir===dir) heldDir=null; }
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  })(dpads[di]);
}

var acts = document.querySelectorAll('.action-btn');
for(var ai=0; ai<acts.length; ai++){
  (function(btn){
    var action = btn.dataset.action;
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault();
      if(mode==='select'){
        if(action==='jump'){
          if(creditsSeen){ SFX.confirm(); goCredits(); return; }
          var now = Date.now();
          triTaps.push(now);
          while(triTaps.length && now - triTaps[0] > 2000) triTaps.shift();
          if(triTaps.length >= 5){ triTaps = []; goCredits(); return; }
          SFX.move();
          return;
        }
        if(action==='punch'){
          var c = roster[selIndex];
          if(c.ready){ SFX.confirm(); goFight(); }
          else { SFX.deny(); toast(c.name + " ISN'T READY YET"); }
        } else if(action==='kick'){ SFX.back(); goStart(); }
        else if(action==='special'){
          var now2 = Date.now();
          sqTaps.push(now2);
          while(sqTaps.length && now2 - sqTaps[0] > 2000) sqTaps.shift();
          if(sqTaps.length >= 5){
            sqTaps = [];
            defeated = {}; creditsSeen = false;
            saveProgress();
            renderSelect();
            SFX.reset();
            toast('PROGRESS RESET');
          }
        }
      } else if(mode==='fight'){
        if(action==='jump') doJump(); else doAttack(action);
      } else if(mode==='victory'){
        continueFromVictory();
      }
    });
  })(acts[ai]);
}

function continueFromVictory(){
  if(mode!=='victory') return;
  elVictory.hidden = true;
  if(allBeaten() && !creditsSeen){ goCredits(); }
  else { SFX.back(); goStart(); renderSelect(); }
}

elCredits.addEventListener('pointerdown', function(){
  elCredits.hidden = true;
  goStart();
  renderSelect();
});

/* ================= BOOT ================= */
loadProgress(function(){ renderSelect(); });
window.addEventListener('load', resize);
setTimeout(resize, 60);
requestAnimationFrame(step);

})();
</script>
